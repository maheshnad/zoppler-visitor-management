name: Keep visitor site awake

on:
  schedule:
    # Render Free sleeps after inactivity. A lightweight health request keeps
    # the public visitor form responsive without exposing any private data.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public health endpoint
        # A free Render service can be starting when this workflow runs.
        # Retry long enough for it to wake, but do not fail the workflow or
        # generate GitHub failure-notification emails if Render is unavailable.
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 50 https://zoppler-visitor-management.onrender.com/api/health; then
              echo "Visitor service is awake."
              exit 0
            fi
            echo "Health check attempt $attempt did not complete; retrying shortly."
            sleep 15
          done
          echo "Render was unavailable for this check. Ending successfully to avoid notification emails."
          exit 0
