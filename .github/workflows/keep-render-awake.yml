name: Keep visitor site awake

on:
  schedule:
    # Render Free sleeps after inactivity. A lightweight health request keeps
    # the public visitor form responsive without exposing any private data.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public health endpoint
        run: curl --fail --silent --show-error --max-time 60 https://zoppler-visitor-management.onrender.com/api/health
